# Run from the repository root with --app <prefix>-estimator.
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "services/estimator-api/Dockerfile"
  build-target = "fly"

[env]
  DATABASE_PATH = "/app/storage/estimates.sqlite"
  MODEL_TIMEOUT_SECONDS = "60"

[[mounts]]
  source = "estimator_data"
  destination = "/app/storage"
  initial_size = "1gb"
  snapshot_retention = 7

[http_service]
  internal_port = 8001
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
