# Run from the repository root with --app <prefix>-web.
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  API_TIMEOUT_MS = "120000"
  APP_ENVIRONMENT = "Production"
  # Swagger stays on the private network. Hide the browser documentation link.
  MODEL_DOCS_URL = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
