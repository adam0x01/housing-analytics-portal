name: Model API

on:
  workflow_call:
  push:
    paths:
      - "services/housing-model-api/**"
      - "data/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/model-api.yml"
  pull_request:
    paths:
      - "services/housing-model-api/**"
      - "data/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/model-api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/housing-model-api/requirements*.txt"
      - name: Install
        working-directory: services/housing-model-api
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint and test
        working-directory: services/housing-model-api
        run: |
          ruff check .
          ruff format --check .
          pytest -q
      - name: Build and check container
        run: |
          docker compose up --build -d --wait --wait-timeout 120 housing-model-api
          curl --fail http://127.0.0.1:8000/health
      - name: Stop container
        if: always()
        run: docker compose down
