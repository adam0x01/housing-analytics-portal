name: Portal and application APIs

on:
  workflow_call:
  push:
    paths: ["apps/web/**", "services/estimator-api/**", "services/market-api/**", "data/**", "docker-compose.yml", ".dockerignore", "scripts/**", ".github/workflows/portal.yml"]
  pull_request:
    paths: ["apps/web/**", "services/estimator-api/**", "services/market-api/**", "data/**", "docker-compose.yml", ".dockerignore", "scripts/**", ".github/workflows/portal.yml"]

permissions:
  contents: read

jobs:
  estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/estimator-api/requirements*.txt
      - name: Test estimator API
        working-directory: services/estimator-api
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          ruff check .
          ruff format --check .
          pytest -q
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Java API
        working-directory: services/market-api
        run: ./mvnw -B verify -Dmarket.dataset-path="${{ github.workspace }}/data/house-prices.csv"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify and build portal
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [estimator, market, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all four services
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify real service integrations
        run: python3 scripts/smoke-stack.py
      - name: Capture logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
